name: Evidence, typography, and M13 Construction Glosses

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  public-fixtures:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.7'
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: Windows setup and public checks
        if: runner.os == 'Windows'
        shell: cmd
        run: setup.bat --no-pause
      - name: Install Linux laboratory dependencies
        if: runner.os != 'Windows'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 fonts-dejavu-core
          python -m pip install -r requirements/requirements-m14.txt
      - name: Validate schemas and evidence references without Inputs
        if: runner.os != 'Windows'
        run: python -m tools.m0 check
      - name: Public synthetic and preservation tests
        if: runner.os != 'Windows'
        run: python -m unittest discover -s tests -v
      - name: Ensure source archive is not tracked
        shell: pwsh
        run: |
          $trackedInputs = @(git ls-files -- Inputs)
          if ($trackedInputs.Count -ne 0) { throw 'Inputs must remain untracked' }
